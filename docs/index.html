<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>创意空间</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Source+Sans+Pro:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Source Sans Pro', sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #2D1B69 0%, #1a1a2e 50%, #16213e 100%);
            color: white;
            overflow-x: hidden;
            position: relative;
        }

        .background-art {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            overflow: hidden;
        }

        .shape {
            position: absolute;
            border-radius: 50%;
            opacity: 0.1;
            filter: blur(40px);
        }

        .shape-1 {
            width: 600px;
            height: 600px;
            background: #FF6B9D;
            top: -200px;
            right: -100px;
            animation: float 20s ease-in-out infinite;
        }

        .shape-2 {
            width: 500px;
            height: 500px;
            background: #4ECDC4;
            bottom: -150px;
            left: -100px;
            animation: float 25s ease-in-out infinite reverse;
        }

        .shape-3 {
            width: 400px;
            height: 400px;
            background: #FFE66D;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            animation: float 30s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-30px) rotate(10deg); }
        }

        .container {
            position: relative;
            z-index: 1;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 2rem;
            text-align: center;
        }

        .title {
            font-family: 'Playfair Display', serif;
            font-size: clamp(3rem, 10vw, 8rem);
            font-weight: 700;
            line-height: 1.1;
            margin-bottom: 1.5rem;
            background: linear-gradient(45deg, #FF6B9D, #4ECDC4, #FFE66D);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 0 40px rgba(255, 107, 157, 0.3);
            animation: titleGlow 8s ease-in-out infinite alternate;
        }

        @keyframes titleGlow {
            0% { filter: drop-shadow(0 0 20px rgba(255, 107, 157, 0.4)); }
            100% { filter: drop-shadow(0 0 30px rgba(78, 205, 196, 0.4)); }
        }

        .subtitle {
            font-size: clamp(1.2rem, 3vw, 1.8rem);
            font-weight: 300;
            max-width: 600px;
            line-height: 1.6;
            margin-bottom: 3rem;
            opacity: 0.9;
        }

        .art-element {
            width: 200px;
            height: 200px;
            margin: 2rem auto;
            position: relative;
            animation: rotate 40s linear infinite;
        }

        .art-element::before,
        .art-element::after {
            content: '';
            position: absolute;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
        }

        .art-element::before {
            width: 100%;
            height: 100%;
            animation: pulse 4s ease-in-out infinite;
        }

        .art-element::after {
            width: 70%;
            height: 70%;
            top: 15%;
            left: 15%;
            animation: pulse 4s ease-in-out infinite 2s;
        }

        @keyframes rotate {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 0.3; }
            50% { transform: scale(1.1); opacity: 0.6; }
        }

        .cta-button {
            display: inline-block;
            padding: 1rem 2.5rem;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50px;
            color: white;
            text-decoration: none;
            font-weight: 600;
            font-size: 1.1rem;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
            background: rgba(255, 255, 255, 0.1);
        }

        .cta-button:hover {
            background: rgba(255, 255, 255, 0.2);
            border-color: rgba(255, 255, 255, 0.5);
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        .footer {
            position: absolute;
            bottom: 2rem;
            left: 0;
            right: 0;
            text-align: center;
            font-size: 0.9rem;
            opacity: 0.6;
        }

        @media (max-width: 768px) {
            .container {
                padding: 1.5rem;
            }

            .art-element {
                width: 150px;
                height: 150px;
            }

            .shape-1 { width: 300px; height: 300px; }
            .shape-2 { width: 250px; height: 250px; }
            .shape-3 { width: 200px; height: 200px; }
        }

        @media (prefers-reduced-motion: reduce) {
            .shape,
            .art-element,
            .title,
            .art-element::before,
            .art-element::after {
                animation: none;
            }
        }
    </style>
</head>
<body>
    <div class="background-art">
        <div class="shape shape-1"></div>
        <div class="shape shape-2"></div>
        <div class="shape shape-3"></div>
    </div>

    <div class="container">
        <h1 class="title">创意空间</h1>
        <p class="subtitle">在这里，想象力自由流动，每一个像素都是艺术的表达。</p>

        <div class="art-element"></div>

        <a href="#" class="cta-button">探索更多</a>
    </div>

    <footer class="footer">
        <p>© 2026 创意空间 - 用代码绘制艺术</p>
    </footer>
</body>
</html>
